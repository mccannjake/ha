                - entity: sensor.byd_sealion_7_charge_remaining_minutes
                  icon: mdi:clock-outline
                  show_state: true
                  show_background: true
              bottom: []
            styles: |
              /* JavaScript to format minutes into H:MM */
              ${(() => {
                const minutes = parseInt(hass.states['sensor.byd_sealion_7_charge_remaining_minutes']?.state);
                const el = card.querySelector('.bubble-sub-button-1 .bubble-state');
                
                if (el && !isNaN(minutes)) {
                  const h = Math.floor(minutes / 60);
                  const m = String(minutes % 60).padStart(2, '0');
                  el.textContent = h + ':' + m;
                }
              })()}
