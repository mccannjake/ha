alias: Set EV Charger Current from Solar (Stable)
description: >
  Calculates solar-based charging current using net export and existing charger
  load. Includes 10s stabilization delay, active grid-import throttling, and safety caps.
mode: queued
max: 3

# Static variables evaluated immediately
variables:
  voltage: 240
  min_current: 6
  max_current: 32
  safety_margin_amps: 0

sequence:
  # 1. Stabilization Delay: Wait 10 seconds for the grid/inverter to settle 
  # after the charger initially turns on or adjusts.
  - delay: "00:00:10"
  
  # 2. Dynamic Variables: Evaluated AFTER the delay to ensure the math uses 
  # real-time, stable power readings rather than a stale 10-second-old snapshot.
  - variables:
      charger_power: '{{ states(''sensor.230211289_power'') | float(0) * 1000 }}'
      export_power: '{{ states(''sensor.solar_export_average'') | float(0) }}'
      charger_current: '{{ states(''sensor.230211289_max_current'') | float(0) | round(0) }}'
      
      # Superior math: actively subtracts export_power (which is positive during grid import) 
      # from the charger's current draw to safely throttle down during cloud cover.
      available_power: >
        {{ [charger_power - export_power, 0] | max }}
      raw_current: '{{ (available_power / voltage) - safety_margin_amps }}'
      target_current: '{{ [min_current, [raw_current, max_current] | min] | max | round(0) }}'
      
  # 3. Execution: Only send commands if the calculated current differs from the active current.
  - condition: template
    value_template: '{{ target_current != charger_current }}'
    
  - action: script.set_ev_charger_max_current
    data:
      amps: '{{ target_current }}'
      
  - action: logbook.log
    data:
      name: EV Charger
      message: >
        Solar-adjusted current: {{ charger_current }}A → {{ target_current }}A
        with {{ available_power | round(0) }}W available (export={{ export_power }}W)
        
  - action: input_text.set_value
    target:
      entity_id: input_text.ev_charger_last_action
    data:
      value: >
        Solar-adjusted current: {{ charger_current }}A → {{ target_current }}A
        with {{ available_power | round(0) }}W available (export={{ export_power }}W)