alias: Morning Bedroom Heater - On
description: "Event-driven morning bedroom heating based on time and temperature"
triggers:
  - trigger: time
    at: "04:10:00"
  - trigger: numeric_state
    entity_id: sensor.bedroom_temp
    below: 20
conditions:
  # 1. Must be during the early morning window
  - condition: time
    after: "04:10:00"
    before: "05:20:00" # Adjust this end time to whenever your morning routine ends
  # 2. Vacation mode must be off
  - condition: state
    entity_id: input_boolean.vacationmode
    state: "off"
  # 3. Someone must be home
  - condition: numeric_state
    entity_id: zone.home
    above: 0
  # 4. Temperature must be low
  - condition: numeric_state
    entity_id: sensor.bedroom_temp
    below: 20
actions:
  # Ava's Room
  - if:
      - condition: state
        entity_id: person.ava
        state: "home"
    then:
      - action: sensibo.full_state
        data:
          mode: heat
          target_temperature: 25
          fan_mode: Low
        target:
          entity_id: climate.ava_s_bedroom

  # Ollie's Room
  - if:
      - condition: state
        entity_id: person.ollie
        state: "home"
    then:
      - action: sensibo.full_state
        data:
          mode: heat
          target_temperature: 25
          fan_mode: Low
        target:
          entity_id: climate.ollie_s_bedroom

  # Leah & Admin's Room (Main Bedroom)
  - if:
      - condition: or
        conditions:
          - condition: state
            entity_id: person.leah
            state: "home"
          - condition: state
            entity_id: person.admin
            state: "home"
    then:
      - action: sensibo.full_state
        data:
          mode: heat
          target_temperature: 25
          fan_mode: Low
        target:
          entity_id: climate.bedroom
mode: single