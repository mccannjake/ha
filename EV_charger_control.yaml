alias: EV Charger Smart Control (Final Robust)
mode: restart
description: >
  Automatically control EV charging based on solar export and/or electricity
  tariff, with full priority logic, stability windows, and defensive conditions.

variables:
  charger_state: "{{ states('sensor.230211289_charger_state') }}"
  charger_current: "{{ states('sensor.230211289_max_current') | float(0) | round(0) }}"
  use_solar: "{{ is_state('input_boolean.ev_solar_enable', 'on') }}"
  use_tariff: "{{ is_state('input_boolean.ev_tariff_enable', 'on') }}"
  export_power: "{{ states('sensor.solar_export_average') | float(0) }}"
  tariff: "{{ states('sensor.import_tariff_rate') | float(1) }}"
# Considering adding a priority mode variable for future use
#  priority_mode: >
#    {% if use_tariff and tariff <= 0.12 %}
#      tariff
#    {% elif use_solar %}
#      solar
#    {% else %}
#      none
#    {% endif %}

triggers:
  # Solar triggers (15 min stable)
  - trigger: numeric_state
    entity_id: sensor.solar_export_average
    below: -1600
    for: "00:15:00"
    id: solar_start
  - trigger: numeric_state
    entity_id: sensor.solar_export_average
    above: 200
    for: "00:15:00"
    id: solar_stop
  
  # Tariff triggers (1 min stable to prevent rapid cycling)
  - trigger: numeric_state
    entity_id: sensor.import_tariff_rate
    below: 0.12
    id: tariff_start
  - trigger: numeric_state
    entity_id: sensor.import_tariff_rate
    above: 0.12
    id: tariff_stop
  
  # Charger becomes ready (standby → check if we should start)
  - trigger: state
    entity_id: sensor.230211289_charger_state
    to: standby
    id: charger_ready
  
  # Periodic adjustment (every 5 min)
  - trigger: time_pattern
    minutes: "/5"
    id: adjust_current
  
  # Mode toggle triggers (immediate response)
  - trigger: state
    entity_id:
      - input_boolean.ev_solar_enable
      - input_boolean.ev_tariff_enable
    id: adjust_current

actions:
  - choose:
      # Independent workflow for setting ev_solar_ready helper
      - conditions:
          - condition: trigger
            id: solar_start
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ev_solar_ready
          - action: logbook.log
            data:
              name: EV Solar Ready
              message: "Solar export conditions met. Set ev_solar_ready to true."

      - conditions:
          - condition: trigger
            id: solar_stop
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ev_solar_ready
          - action: logbook.log
            data:
              name: EV Solar Ready
              message: "Solar export conditions no longer met. Set ev_solar_ready to false."

  - choose:
      ####################################################
      # 💲 Tariff Mode (takes priority when tariff is cheap)
      ####################################################
      - conditions:
          - condition: template
            value_template: "{{ use_tariff and (tariff <= 0.12 or trigger.id == 'tariff_stop') }}"
            alias: Tariff Mode Active & Tariff <= 0.12 OR Tariff Mode Active & Tariff Stop Triggered
        sequence:
          - choose:
              # Start charging on cheap tariff
              - conditions:
                  - condition: trigger
                    id:
                      - tariff_start
                      - charger_ready
                      - adjust_current
                  - condition: template
                    value_template: "{{ charger_state == 'standby' }}"
                sequence:
                  - action: beny_wifi.start_charging
                    data:
                      device_id: a9d83e66ef57dc66d600495b961d94cf
                  - action: script.set_ev_charger_max_current
                    data:
                      amps: 32
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: "Started charging - Tariff mode ({{ tariff }}/kWh @ 32A)"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: "Started charging - Tariff mode ({{ tariff }}/kWh @ 32A)"
              
              # Stop charging on expensive tariff
              # Future enhancement: if solar enabled and available, switch to solar mode instead
              # Can manually trigger with solar_start or charger_ready triggers
              - conditions:
                  - condition: trigger
                    id: tariff_stop
                  - condition: template
                    value_template: "{{ charger_state in ['charging', 'waiting'] }}"
                sequence:
                  - action: beny_wifi.stop_charging
                    data:
                      device_id: a9d83e66ef57dc66d600495b961d94cf
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: "Stopped charging - Tariff too high ({{ tariff }}/kWh)"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: "Stopped charging - Tariff too high ({{ tariff }}/kWh)"
              
              # Maintain full power during cheap tariff
              - conditions:
                  - condition: trigger
                    id: adjust_current
                  - condition: template
                    value_template: "{{ charger_state == 'charging' }}"
                sequence:
                  - condition: template
                    value_template: "{{ charger_current != 32 }}"
                  - action: script.set_ev_charger_max_current
                    data:
                      amps: 32
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: "Adjusted current - Tariff mode ({{ charger_current }}A → 32A @ {{ tariff }}/kWh)"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: "Adjusted current - Tariff mode ({{ charger_current }}A → 32A @ {{ tariff }}/kWh)"

      ####################################################
      # ☀️ Solar Mode (runs when tariff mode not active)
      ####################################################
      - conditions:
          - condition: template
            value_template: "{{ use_solar }}"
            alias: Solar Mode Active
        sequence:
          - choose:
              # Start charging on solar export
              - conditions:
                  - condition: trigger
                    id:
                      - solar_start
                  - condition: template
                    value_template: "{{ charger_state == 'standby' and is_state('input_boolean.ev_solar_ready', 'on') }}"
                sequence:
                  - action: beny_wifi.start_charging
                    data:
                      device_id: a9d83e66ef57dc66d600495b961d94cf
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: "Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: "Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)"
                  # ⏳ Wait briefly for sensors to stabilise, then trigger adjust_current
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.ev_force_adjust_current
                  - action: logbook.log
                    data:
                      name: Force Adjust Current
                      message: "Solar start - forcing adjust_current after 10s delay"
                  - delay: "00:00:10"
                  - action: script.set_ev_charger_current_from_solar
                    data: {}

              # Start charging on solar export when charger just became ready
              - conditions:
                  - condition: trigger
                    id:
                      - charger_ready
                  - condition: template
                    value_template: "{{ charger_state == 'standby' and is_state('input_boolean.ev_solar_ready', 'on') }}"
                sequence:
                  - action: beny_wifi.start_charging
                    data:
                      device_id: a9d83e66ef57dc66d600495b961d94cf
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: "Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: "Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)"
                  # ⏳ Wait briefly for sensors to stabilise, then trigger adjust_current
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.ev_force_adjust_current
                  - action: logbook.log
                    data:
                      name: Force Adjust Current
                      message: "Charger became ready - forcing adjust_current after 10s delay"
                  - delay: "00:00:10"
                  - action: script.set_ev_charger_current_from_solar
                    data: {}
              
              # Stop charging on grid import
              - conditions:
                  - condition: trigger
                    id: solar_stop
                  - condition: template
                    value_template: "{{ charger_state in ['charging', 'waiting'] }}"
                sequence:
                  - action: beny_wifi.stop_charging
                    data:
                      device_id: a9d83e66ef57dc66d600495b961d94cf
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: "Stopped charging - Solar mode ({{ export_power | round(0) }}W import)"
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: "Stopped charging - Solar mode ({{ export_power | round(0) }}W import)"
              
              # Adjust current based on available solar
              - conditions:
                  - condition: template
                    value_template: >
                      {{ trigger.id == 'adjust_current' or is_state('input_boolean.ev_force_adjust_current', 'on') }}
                  - condition: template
                    value_template: "{{ charger_state == 'charging' }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ev_force_adjust_current
                  - action: script.set_ev_charger_current_from_solar
                    data: {}
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ev_force_adjust_current