alias: EV Charger Smart Control (Final Robust)
description: >
  Automatically control EV charging based on solar export and/or electricity
  tariff, with full priority logic, stability windows, and defensive conditions.
triggers:
  - trigger: numeric_state
    entity_id: sensor.solar_export_average
    below: -1600
    for: "00:15:00"
    id: solar_start
  - trigger: numeric_state
    entity_id: sensor.solar_export_average
    above: 200
    for: "00:15:00"
    id: solar_stop
  - trigger: numeric_state
    entity_id: sensor.solar_export_average
    above: -1600
    for:
      hours: 0
      minutes: 15
      seconds: 0
      milliseconds: 0
    id: solar_stop_not_charging
  - trigger: numeric_state
    entity_id: sensor.import_tariff_rate
    below: 0.12
    id: tariff_start
  - trigger: numeric_state
    entity_id: sensor.import_tariff_rate
    above: 0.12
    id: tariff_stop
  - trigger: state
    entity_id: sensor.230211289_charger_state
    to: standby
    id: charger_ready
  - trigger: time_pattern
    minutes: /5
    id: adjust_current
  - trigger: state
    entity_id:
      - input_boolean.ev_solar_enable
      - input_boolean.ev_tariff_enable
    id: adjust_current
  # Defensive trigger: watches ONLY the solar export sensor
  - trigger: state
    entity_id:
      - sensor.solar_export_average
    to:
      - unavailable
      - unknown
      - "null"
      - "none"
    id: telemetry_lost

actions:
  # Safety Interlock: Stop charging if solar export telemetry drops out
  - choose:
      - conditions:
          - condition: template
            value_template: "{{ not telemetry_ok or trigger.id == 'telemetry_lost' }}"
          - condition: template
            value_template: "{{ charger_state in ['charging', 'waiting'] }}"
        sequence:
          - action: beny_wifi.stop_charging
            data:
              device_id: 88c49aafe0e72ff92ca85a4f0657a018
          - action: logbook.log
            data:
              name: EV Charger Safety
              message: "Stopped charging: Solar export sensor reported offline/null."
          - action: input_text.set_value
            target:
              entity_id: input_text.ev_charger_last_action
            data:
              value: "Stopped charging - Solar telemetry lost"

  # Solar Flag Management
  - choose:
      - conditions:
          - condition: trigger
            id: solar_start
          - condition: template
            value_template: "{{ telemetry_ok }}"
        sequence:
          - action: input_boolean.turn_on
            target:
              entity_id: input_boolean.ev_solar_ready
          - action: logbook.log
            data:
              name: EV Solar Ready
              message: Solar export conditions met. Set ev_solar_ready to true.
      - conditions:
          - condition: trigger
            id: solar_stop
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ev_solar_ready
          - action: logbook.log
            data:
              name: EV Solar Ready
              message: Solar export conditions no longer met. Set ev_solar_ready to false.
      - conditions:
          - condition: trigger
            id: solar_stop_not_charging
          - condition: template
            value_template: "{{ charger_state not in ['charging'] }}"
        sequence:
          - action: input_boolean.turn_off
            target:
              entity_id: input_boolean.ev_solar_ready
            data: {}
          - action: logbook.log
            data:
              name: EV Solar Ready
              message: Solar export conditions no longer met while not charging. Set ev_solar_ready to false.

  # Primary Charger Control Block
  - choose:
      - conditions:
          - condition: template
            value_template: >-
              {{ use_tariff and (tariff <= 0.12 or trigger.id == 'tariff_stop') }}
            alias: Tariff Mode Active & Tariff <= 0.12 OR Tariff Mode Active & Tariff Stop Triggered
        sequence:
          - choose:
              - conditions:
                  - condition: trigger
                    id:
                      - tariff_start
                      - charger_ready
                      - adjust_current
                  - condition: template
                    value_template: "{{ charger_state == 'standby' }}"
                sequence:
                  - action: beny_wifi.start_charging
                    data:
                      device_id: 88c49aafe0e72ff92ca85a4f0657a018
                  - action: script.set_ev_charger_max_current
                    data:
                      amps: 32
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: Started charging - Tariff mode ({{ tariff }}/kWh @ 32A)
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: Started charging - Tariff mode ({{ tariff }}/kWh @ 32A)
              - conditions:
                  - condition: trigger
                    id: tariff_stop
                  - condition: template
                    value_template: "{{ charger_state in ['charging', 'waiting'] }}"
                sequence:
                  - choose:
                      - conditions:
                          - condition: state
                            entity_id: input_boolean.ev_solar_ready
                            state: "on"
                        sequence:
                          - action: script.calculate_ev_charger_current_from_solar
                            data: {}
                          - action: logbook.log
                            data:
                              name: EV Charger
                              message: Switched from Tariff to Solar mode ({{ tariff }}/kWh → solar)
                          - action: input_text.set_value
                            target:
                              entity_id: input_text.ev_charger_last_action
                            data:
                              value: Switched from Tariff to Solar mode ({{ tariff }}/kWh → solar)
                    default:
                      - action: beny_wifi.stop_charging
                        data:
                          device_id: 88c49aafe0e72ff92ca85a4f0657a018
                      - action: logbook.log
                        data:
                          name: EV Charger
                          message: Stopped charging - Tariff too high ({{ tariff }}/kWh)
                      - action: input_text.set_value
                        target:
                          entity_id: input_text.ev_charger_last_action
                        data:
                          value: Stopped charging - Tariff too high ({{ tariff }}/kWh)
              - conditions:
                  - condition: trigger
                    id: adjust_current
                  - condition: template
                    value_template: "{{ charger_state == 'charging' }}"
                sequence:
                  - condition: template
                    value_template: "{{ charger_current != 32 }}"
                  - action: script.set_ev_charger_max_current
                    data:
                      amps: 32
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: >-
                        Adjusted current - Tariff mode ({{ charger_current }}A → 32A @ {{ tariff }}/kWh)
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: >-
                        Adjusted current - Tariff mode ({{ charger_current }}A → 32A @ {{ tariff }}/kWh)
      - conditions:
          - condition: template
            value_template: "{{ telemetry_ok and use_solar }}"
            alias: Solar Mode Active
        sequence:
          - choose:
              - conditions:
                  - condition: trigger
                    id:
                      - solar_start
                  - condition: template
                    value_template: >-
                      {{ charger_state == 'standby' and is_state('input_boolean.ev_solar_ready', 'on') }}
                sequence:
                  - action: beny_wifi.start_charging
                    data:
                      device_id: 88c49aafe0e72ff92ca85a4f0657a018
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: >-
                        Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: >-
                        Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.ev_force_adjust_current
                  - action: logbook.log
                    data:
                      name: Force Adjust Current
                      message: Solar start - forcing adjust_current (script handles 10s delay)
                  - action: script.set_ev_charger_current_from_solar
                    data: {}
              - conditions:
                  - condition: trigger
                    id:
                      - charger_ready
                  - condition: template
                    value_template: >-
                      {{ charger_state == 'standby' and is_state('input_boolean.ev_solar_ready', 'on') }}
                sequence:
                  - action: beny_wifi.start_charging
                    data:
                      device_id: 88c49aafe0e72ff92ca85a4f0657a018
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: >-
                        Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: >-
                        Started charging - Solar mode ({{ -1 * export_power | round(0) }}W export)
                  - action: input_boolean.turn_on
                    target:
                      entity_id: input_boolean.ev_force_adjust_current
                  - action: logbook.log
                    data:
                      name: Force Adjust Current
                      message: Charger became ready - forcing adjust_current (script handles 10s delay)
                  - action: script.set_ev_charger_current_from_solar
                    data: {}
              - conditions:
                  - condition: trigger
                    id: solar_stop
                  - condition: template
                    value_template: "{{ charger_state in ['charging', 'waiting'] }}"
                sequence:
                  - action: beny_wifi.stop_charging
                    data:
                      device_id: 88c49aafe0e72ff92ca85a4f0657a018
                  - action: logbook.log
                    data:
                      name: EV Charger
                      message: >-
                        Stopped charging - Solar mode ({{ export_power | round(0) }}W import)
                  - action: input_text.set_value
                    target:
                      entity_id: input_text.ev_charger_last_action
                    data:
                      value: >-
                        Stopped charging - Solar mode ({{ export_power | round(0) }}W import)
              - conditions:
                  - condition: template
                    value_template: >-
                      {{ trigger.id == 'adjust_current' or is_state('input_boolean.ev_force_adjust_current', 'on') }}
                  - condition: template
                    value_template: "{{ charger_state == 'charging' }}"
                sequence:
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ev_force_adjust_current
                  - action: script.set_ev_charger_current_from_solar
                    data: {}
                  - action: input_boolean.turn_off
                    target:
                      entity_id: input_boolean.ev_force_adjust_current

mode: restart

variables:
  charger_state: "{{ states('sensor.230211289_charger_state') }}"
  charger_current: "{{ states('sensor.230211289_max_current') | float(0) | round(0) }}"
  use_solar: "{{ is_state('input_boolean.ev_solar_enable', 'on') }}"
  use_tariff: "{{ is_state('input_boolean.ev_tariff_enable', 'on') }}"
  export_raw: "{{ states('sensor.solar_export_average') }}"
  tariff: "{{ states('sensor.import_tariff_rate') | float(1) }}"
  # Evaluates strictly to true ONLY when solar_export_average is valid
  telemetry_ok: >-
    {{ export_raw not in ['unavailable', 'unknown', 'null', 'none', None] }}
  export_power: "{{ export_raw | float(0) }}"